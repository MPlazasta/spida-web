<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — SPIDA</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <style>
    .login-page {
      min-height: calc(100vh - 73px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      background: linear-gradient(160deg, #fff8f4 0%, #ffffff 50%, #f4f8ff 100%);
    }
    .login-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .login-card h1 {
      font-size: clamp(1.6rem, 3vw, 2rem);
      margin-bottom: 0.25em;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      color: #666;
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }
    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-auth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      border: 1.5px solid #e5e5e5;
      background: #ffffff;
      color: #1a1a1a;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      width: 100%;
    }
    .btn-auth:hover {
      background: #f7f5f2;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .btn-auth-apple {
      background: #1a1a1a;
      color: #ffffff;
      border-color: #1a1a1a;
    }
    .btn-auth-apple:hover {
      background: #333333;
      transform: translateY(-1px);
    }
    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><img src="favicon.png" alt="" width="28" height="28" />SPIDA</a>
      <nav class="nav-links">
        <a href="index.html#adventure">L'app</a>
        <a href="index.html#routing">Navigation</a>
        <a href="index.html#community">Communauté</a>
      </nav>
      <div class="nav-actions">
        <a href="#" class="btn btn-store btn-sm">App Store</a>
        <a href="#" class="btn btn-store btn-sm">Google Play</a>
      </div>
    </div>
  </header>

  <main class="login-page">
    <div class="login-card">
      <h1>Bienvenue</h1>
      <p class="login-subtitle">Connectez-vous à votre compte SPIDA</p>

      <div class="auth-buttons">

        <a href="#" class="btn-auth" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.259c-.806.54-1.837.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Continuer avec Google
        </a>

        <a href="#" class="btn-auth btn-auth-apple" id="btn-apple">
          <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M13.544 9.62c-.022-2.565 2.092-3.8 2.185-3.858-1.19-1.738-3.044-1.975-3.703-2.002-1.571-.159-3.073.928-3.873.928-.797 0-2.024-.907-3.327-.882-1.71.025-3.294 1.001-4.174 2.53C-.047 9.132.955 13.8 2.7 16.44c.87 1.295 1.9 2.744 3.253 2.692 1.311-.054 1.808-.862 3.393-.862 1.584 0 2.038.862 3.422.832 1.408-.022 2.3-1.305 3.16-2.607.999-1.493 1.41-2.947 1.433-3.022-.032-.013-2.794-1.084-2.817-3.855z" fill="white"/>
            <path d="M11.085 2.522C11.784 1.65 12.254.459 12.12 0c-1.086.043-2.405.722-3.184 1.597C8.19 2.458 7.638 3.677 7.79 4.837c1.21.093 2.456-.619 3.295-2.315z" fill="white"/>
          </svg>
          Continuer avec Apple
        </a>


      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <h2 class="footer-title">Prêt à rouler en douceur ?</h2>
      <div class="cta-group">
        <a href="#" class="btn btn-store">App Store</a>
        <a href="#" class="btn btn-store">Google Play</a>
      </div>
      <nav class="footer-links">
        <a href="mailto:contact@spida.app">Contact</a>
        <a href="connexion.html">Mon compte</a>
        <a href="confidentialite.html">Confidentialité</a>
        <a href="cgu.html">CGU</a>
        <a href="mentions-legales.html">Mentions légales</a>
      </nav>
      <p class="copyright">© 2026 SPIDA. Tous droits réservés.</p>
    </div>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://ufnrororwpbzqzmsmvyn.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbnJvcm9yd3BienF6bXNtdnluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODYyMDMsImV4cCI6MjA5MDU2MjIwM30.Kym3CNUcQHQowKAfZ8LgjFkCZ4H-s4rG3Tn7BZ4RsHE'
    );

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'mon-compte.html';
    });

    document.getElementById('btn-google').addEventListener('click', async (e) => {
      e.preventDefault();
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/mon-compte.html' }
      });
    });

    document.getElementById('btn-apple').addEventListener('click', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
